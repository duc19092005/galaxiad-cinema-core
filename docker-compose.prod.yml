services:
  # CI/CD Trigger: test rebuild
  # ─────────────────────────────────────────
  # C# ASP.NET Core API (Production)
  # ─────────────────────────────────────────
  api:
    build:
      context: ./apps/backend
      dockerfile: Cinema.Api/Dockerfile
      target: final
    # Ports mapping is commented out for security. Traffic should go through Nginx.
    # ports:
    #   - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__AutoMigrate=${DATABASE_AUTO_MIGRATE:-true}
      - ConnectionStrings__DatabaseConnection=${DATABASE_CONNECTION}
      - ConnectionStrings__HangfireConnection=${HANGFIRE_CONNECTION}
      - ConnectionStrings__RedisConnection=${REDIS_CONNECTION}
      - AllowedOrigins__0=https://galaxiadcine.online
      - AllowedOrigins__1=https://www.galaxiadcine.online
      - FrontendBaseUrl=${FRONTEND_BASE_URL:-https://galaxiadcine.online}
      - JWT_Info__Key=${JWT_KEY}
      - JWT_Info__Iss=${JWT_ISS}
      - JWT_Info__Aud=${JWT_AUD}
      - AES_256__Key=${AES_256_KEY}
      - AES_256__IV=${AES_256_IV}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
      - AiService__BaseUrl=${AI_SERVICE_REST_URL:-http://cinema-ai-service:8000}
      - AiService__GrpcUrl=${AI_SERVICE_GRPC_URL:-http://cinema-ai-service:50051}
      - VNPay__TmnCode=${VNPAY_TMN_CODE}
      - VNPay__HashSecret=${VNPAY_HASH_SECRET}
      - VNPay__PayUrl=${VNPAY_PAY_URL}
      - VNPay__ReturnUrl=${VNPAY_RETURN_URL}
      - Google__ClientId=${GOOGLE_CLIENT_ID}
      - Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - Google__WebCallbackUrl=${GOOGLE_WEB_CALLBACK_URL:-https://api.galaxiadcine.online/api/v1/IdentityAccess/google-callback-web}
      - Google__MobileCallbackUrl=${GOOGLE_MOBILE_CALLBACK_URL:-https://api.galaxiadcine.online/api/v1/IdentityAccess/google-callback-mobile}
      - SeedAccounts__ProductionManagerPasswordHash=${PRODUCTION_MANAGER_PASSWORD_HASH}
    networks:
      - cinema-network
    depends_on:
      cinema-ai-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Python AI Microservice (Production)
  # Cloud embedding (Jina AI) + Cloud Qdrant
  # ─────────────────────────────────────────
  cinema-ai-service:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - EMBEDDING_BACKEND=cloud
      - HOST=0.0.0.0
      - PORT=8000
      - EMBEDDING_DIM=768
      - JINA_API_KEY=${JINA_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-cinema_movies}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - TAVILY_API_KEY=${TAVILY_API_KEY:?TAVILY_API_KEY is required}
      - TAVILY_MCP_URL=${TAVILY_MCP_URL:-}
      - BUSINESS_RESEARCH_MAX_RESULTS=${BUSINESS_RESEARCH_MAX_RESULTS:-5}
      - BUSINESS_RESEARCH_TIMEOUT_SECONDS=${BUSINESS_RESEARCH_TIMEOUT_SECONDS:-45}
      - BACKEND_API_URL=${BACKEND_API_URL:-http://api:8080/api/v1}
      - REDIS_CONNECTION=${REDIS_CONNECTION}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    restart: unless-stopped
    networks:
      - cinema-network

  # ─────────────────────────────────────────
  # Nginx Reverse Proxy
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    networks:
      - cinema-network
    depends_on:
      - api

networks:
  cinema-network:
    driver: bridge

