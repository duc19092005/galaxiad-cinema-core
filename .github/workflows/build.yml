name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-backend:
    name: Build Backend (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Backend.sln

      - name: Build
        run: dotnet build Backend.sln --no-restore --configuration Release

  build-frontend:
    name: Build Frontend (TypeScript + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  build-ai:
    name: Build AI Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/ai/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt --dry-run

      - name: Syntax check
        run: python -m py_compile app/main.py

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-ai]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /var/portainer_data/compose/5
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/duc19092005/galaxiad-cinema-core.git
            fi
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml -p galaxiad-cinema down
            docker compose -f docker-compose.prod.yml -p galaxiad-cinema up -d --build --remove-orphans




