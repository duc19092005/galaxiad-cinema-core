services:
  oracle-free:
    image: container-registry.oracle.com/database/free:latest
    container_name: cinema-oracle-free
    ports:
      - "1521:1521"
    environment:
      ORACLE_PWD: Oracle123
    volumes:
      - oracle_free_data:/opt/oracle/oradata
      - ./docker-init:/opt/oracle/scripts/setup:ro
      - ./sql:/opt/oracle/scripts/setup/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s

volumes:
  oracle_free_data:
