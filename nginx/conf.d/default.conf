map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost; # Replace with your domain name, e.g., galaxiadcine.online

    # Increase body size to support poster/banner uploads
    client_max_body_size 50M;

    # Reverse proxy to C# ASP.NET Core API
    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        
        # Support WebSockets for SignalR (Seat locking & Live update)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Timeout settings for long-lived SignalR connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

