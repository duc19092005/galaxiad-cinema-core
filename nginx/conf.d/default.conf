map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.galaxiadcine.online;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# Cấu hình SSL chính thức (Đã kích hoạt)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.galaxiadcine.online;

    client_max_body_size 50M;

    # Đường dẫn chứng chỉ SSL của Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/api.galaxiadcine.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.galaxiadcine.online/privkey.pem;

    # Optimize SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Reverse proxy to C# ASP.NET Core API
    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        
        # Support WebSockets for SignalR (Seat locking & Live update)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Timeout settings for long-lived SignalR connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}


