services:
  api:
    build:
      context: ../../apps/backend
      dockerfile: ../../infrastructure/docker/dockerfiles/backend.Dockerfile
      target: final
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__AutoMigrate=${DATABASE_AUTO_MIGRATE:-true}
      - ConnectionStrings__DatabaseConnection=${DATABASE_CONNECTION}
      - ConnectionStrings__HangfireConnection=${HANGFIRE_CONNECTION}
      - ConnectionStrings__RedisConnection=${REDIS_CONNECTION}
      - AllowedOrigins__0=https://galaxiadcine.online
      - AllowedOrigins__1=https://www.galaxiadcine.online
      - FrontendBaseUrl=${FRONTEND_BASE_URL:-https://galaxiadcine.online}
      - JWT_Info__Key=${JWT_KEY}
      - JWT_Info__Iss=${JWT_ISS}
      - JWT_Info__Aud=${JWT_AUD}
      - AES_256__Key=${AES_256_KEY}
      - AES_256__IV=${AES_256_IV}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
      - AiService__BaseUrl=${AI_SERVICE_REST_URL:-http://ai-http:8000}
      - AiService__GrpcUrl=${AI_SERVICE_GRPC_URL:-http://ai-grpc:50051}
      - VNPay__TmnCode=${VNPAY_TMN_CODE}
      - VNPay__HashSecret=${VNPAY_HASH_SECRET}
      - VNPay__PayUrl=${VNPAY_PAY_URL}
      - VNPay__ReturnUrl=${VNPAY_RETURN_URL}
      - Google__ClientId=${GOOGLE_CLIENT_ID}
      - Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - Google__WebCallbackUrl=${GOOGLE_WEB_CALLBACK_URL:-https://api.galaxiadcine.online/api/v1/IdentityAccess/google-callback-web}
      - Google__MobileCallbackUrl=${GOOGLE_MOBILE_CALLBACK_URL:-https://api.galaxiadcine.online/api/v1/IdentityAccess/google-callback-mobile}
      - Tmdb__ApiKey=${TMDB_API_KEY}
      - Tmdb__ImageBaseUrl=${TMDB_IMAGE_BASE_URL:-https://image.tmdb.org/t/p/w185}
      - SeedAccounts__ProductionManagerPasswordHash=${PRODUCTION_MANAGER_PASSWORD_HASH}
    networks:
      - cinema-prod-net
    depends_on:
      ai-http:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    restart: unless-stopped

  ai-http:
    build:
      context: ../../services/ai
      dockerfile: ../../infrastructure/docker/dockerfiles/ai.Dockerfile
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - EMBEDDING_BACKEND=cloud
      - HOST=0.0.0.0
      - PORT=8000
      - EMBEDDING_DIM=768
      - JINA_API_KEY=${JINA_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-cinema_movies}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - BACKEND_API_URL=${BACKEND_API_URL:-http://api:8080/api/v1}
      - REDIS_CONNECTION=${REDIS_CONNECTION}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: "1.5"
    restart: unless-stopped
    networks:
      - cinema-prod-net

  ai-grpc:
    build:
      context: ../../services/ai
      dockerfile: ../../infrastructure/docker/dockerfiles/ai.Dockerfile
    command: ["python", "app/grpc_server.py"]
    ports:
      - "50051:50051"
    environment:
      - ENVIRONMENT=production
      - EMBEDDING_BACKEND=cloud
      - JINA_API_KEY=${JINA_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-cinema_movies}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - BACKEND_API_URL=${BACKEND_API_URL:-http://api:8080/api/v1}
      - REDIS_CONNECTION=${REDIS_CONNECTION}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    restart: unless-stopped
    networks:
      - cinema-prod-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    networks:
      - cinema-prod-net
    depends_on:
      - api

networks:
  cinema-prod-net:
    driver: bridge
