services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=CinemaDev123!
    volumes:
      - dev_sql_data:/var/opt/mssql
    networks:
      - cinema-dev-net

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - cinema-dev-net

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - dev_qdrant_data:/qdrant/storage
    networks:
      - cinema-dev-net

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=cinema-local
      - MINIO_ROOT_PASSWORD=cinema-local-secret
    volumes:
      - dev_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - cinema-dev-net

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    gpus: all
    volumes:
      - dev_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - cinema-dev-net

  ollama-init:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["until OLLAMA_HOST=http://ollama:11434 ollama list >/dev/null 2>&1; do sleep 2; done; OLLAMA_HOST=http://ollama:11434 ollama pull qwen3.5:4b"]
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - cinema-dev-net

  ai-http:
    build:
      context: ../../services/ai
      dockerfile: ../../infrastructure/docker/dockerfiles/ai.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../../services/ai:/app
      - /app/app/pb
      - dev_huggingface_data:/root/.cache/huggingface
    environment:
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8000
      - QDRANT_URL=http://qdrant:6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LLM_PROVIDER=ollama
      - DEEPSEEK_BASE_URL=http://ollama:11434/v1
      - DEEPSEEK_MODEL=qwen3.5:4b
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 240
      start_period: 30s
    networks:
      - cinema-dev-net

  ai-grpc:
    build:
      context: ../../services/ai
      dockerfile: ../../infrastructure/docker/dockerfiles/ai.Dockerfile
    command: ["python", "app/grpc_server.py"]
    ports:
      - "50051:50051"
    volumes:
      - ../../services/ai:/app
      - /app/app/pb
      - dev_huggingface_data:/root/.cache/huggingface
    environment:
      - ENVIRONMENT=development
      - QDRANT_URL=http://qdrant:6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LLM_PROVIDER=ollama
      - DEEPSEEK_BASE_URL=http://ollama:11434/v1
      - DEEPSEEK_MODEL=qwen3.5:4b
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    networks:
      - cinema-dev-net

  api:
    build:
      context: ../../apps/backend
      dockerfile: ../../infrastructure/docker/dockerfiles/backend.Dockerfile
      target: development
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ../../apps/backend:/src
      - /src/Cinema.Api/bin
      - /src/Cinema.Api/obj
      - /src/Cinema.Application/bin
      - /src/Cinema.Application/obj
      - /src/Cinema.Domain/bin
      - /src/Cinema.Domain/obj
      - /src/Cinema.Infrastructure/bin
      - /src/Cinema.Infrastructure/obj
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=false
      - Database__AutoMigrate=true
      - ConnectionStrings__DatabaseConnection=Server=mssql;Database=CinemaDevDb;User Id=sa;Password=CinemaDev123!;TrustServerCertificate=True;
      - ConnectionStrings__HangfireConnection=Server=mssql;Database=CinemaDevDb;User Id=sa;Password=CinemaDev123!;TrustServerCertificate=True;
      - ConnectionStrings__RedisConnection=redis:6379,abortConnect=false
      - AiService__BaseUrl=http://ai-http:8000
      - AiService__GrpcUrl=http://ai-grpc:50051
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=cinema-local
      - Minio__SecretKey=cinema-local-secret
      - Minio__ContractBucket=cinema-contracts
      - Minio__UseSsl=false
    depends_on:
      mssql:
        condition: service_started
      redis:
        condition: service_started
      ai-http:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - cinema-dev-net

  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: ../../infrastructure/docker/dockerfiles/frontend.Dockerfile
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ../../apps/frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    depends_on:
      - api
    networks:
      - cinema-dev-net

networks:
  cinema-dev-net:
    driver: bridge

volumes:
  dev_sql_data:
  dev_qdrant_data:
  dev_huggingface_data:
  dev_minio_data:
  dev_ollama_data:
